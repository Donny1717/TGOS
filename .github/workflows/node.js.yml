# TGOS CI — install, regulatory verify, web build
# Node 22+ required (see package.json engines and tools/)

name: Node.js CI

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  build:
    runs-on: ubuntu-latest

    strategy:
      matrix:
        node-version: [22.x]

    steps:
    - uses: actions/checkout@v4
    - name: Use Node.js ${{ matrix.node-version }}
      uses: actions/setup-node@v4
      with:
        node-version: ${{ matrix.node-version }}
        cache: 'npm'
    - run: npm ci
    - name: Verify regulatory tools (validate + rules + tokens)
      run: npm run verify
    - name: Build web app
      run: npm run build --if-present
